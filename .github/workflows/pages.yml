# AI-generated with Claude Code (Anthropic), directed and reviewed by the Moonat team.
# Deploy the static site in web/ to GitHub Pages on every push to main (and on demand).
name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node (for the web tests)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run the web-app tests (a failing test blocks the deploy)
        run: node --test web/tests/app_*.test.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Leave the developer pages out of the public site
        # web/sky-demo.html is the sky viewer's test bench (open it locally with `python -m http.server -d web`).
        # Nothing on the site links to it; the tests do not use it.
        run: rm -f web/sky-demo.html

      - name: Upload the web/ folder
        uses: actions/upload-pages-artifact@v5
        with:
          path: web

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
