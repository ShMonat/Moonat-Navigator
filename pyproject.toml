[project]
name = "moonat"
version = "0.1.0"
description = "Lunar Landing Site Navigator - NASA Space Apps 2026"
authors = [
    { name = "Moonat team (Shay Monat, Shahar)" }
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "skyfield>=1.55",
]

[project.scripts]
moonat = "moonat:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "imageio-ffmpeg>=0.8.1",
    "playwright>=1.65.2",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
